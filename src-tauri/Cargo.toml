[package]
name = "rust-template"
description = "A starting point for desktop apps in Rust: Tauri, React and installers for Linux, Windows and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The binary in main.rs calls into this library. The name stays the same when
# you rename the app, so you never have to touch main.rs.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
app-core = { path = "../crates/app-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
